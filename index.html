<!DOCTYPE html>
<html>
<head>
  <title>Wiki Forever</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      height: 100%;
    }

    body {
      text-align: center;
    }

    h1 {
      margin-top: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 10px;
    }

    .card {
      background: #222;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
      cursor: pointer;
    }

    .card:hover {
      background: #333;
    }

    .title {
      font-size: 18px;
      font-weight: bold;
    }

    .subtitle {
      font-size: 12px;
      color: #aaa;
    }

    .contentPage {
      text-align: left;
      padding: 10px;
    }

    /* 🔥 THE IMPORTANT PART */
    .scrollBox {
      max-height: 300px; /* you can change this later */
      overflow-y: auto;
      background: #1a1a1a;
      padding: 10px;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
    }

    .updateBox {
      background: #2a2a2a;
      border-left: 5px solid #4CAF50;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 8px;
    }

    button {
      padding: 10px;
      margin: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>Wiki Forever</h1>

<div id="path"></div>
<div class="container" id="content"></div>

<script>
const latestUpdate = `Author's Update:
This site is still being built. More pages, better info, and improvements are coming soon.`;

const data = {
  "TV Shows": {

    "Marvel": {
      "Agents of Shield": {
        content: `This is my page about Agents of Shield. I will update it over time.

Agents of S.H.I.E.L.D. is a Marvel television show. Season 1 Episode 1 takes place right after Loki invaded Manhattan.

Main characters on the replacement S.H.I.E.L.D. team:
Grant Ward (later revealed as Hydra)
Jemma Simmons
Leo Fitz
Melinda May
Phil Coulson

John Garrett is also involved and is later revealed as the Clairvoyant.`
      }
    },

    "DC": {
      "Flash": {
        "2014 Edition": {
          content: `So... your friend who watched the 2014 Flash series might keep saying "my name is Barry Allen" in an RP. Who is he?

Barry Allen (The Flash) is a speedster who saves people and stops villains.

He got his powers years after the death of his mom because of Eobard Thawne (formerly disguised as Dr. Wells). It is later revealed Thawne killed his mother out of rage after failing to kill Barry.

Anyway, the particle accelerator exploded and created metahumans—and the Flash.

Don't watch past Season 4—it gets bad. By Season 7 it's just stupid. The ending is... eh.`
        }
      }
    }

  }
};

let current = data;
let stack = [];

function render() {
  const container = document.getElementById("content");
  container.innerHTML = "";

  if (current.content) {
    container.innerHTML = `
      <div class="contentPage">

        <div class="updateBox">
          <strong>🔔 Author's Latest Update</strong>
          <p>${latestUpdate}</p>
        </div>

        <h2>Info</h2>

        <div class="scrollBox" id="scrollBox"></div>

      </div>
    `;

    document.getElementById("scrollBox").innerText = current.content;

    updatePath();
    return;
  }

  Object.keys(current).forEach(key => {
    let div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="title">${key}</div>
      <div class="subtitle">Click to open</div>
    `;

    div.onclick = () => {
      stack.push(current);
      current = current[key];
      render();
    };

    container.appendChild(div);
  });

  updatePath();
}

function updatePath() {
  const pathDiv = document.getElementById("path");

  if (stack.length > 0) {
    pathDiv.innerHTML = `<button onclick="goBack()">⬅ Back</button>`;
  } else {
    pathDiv.innerHTML = "";
  }
