<!DOCTYPE html>
<html>
<head>
  <title>Wiki Forever</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      margin: 0;
    }

    h1 {
      margin: 20px 0;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 10px;
    }

    .card {
      background: #222;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
      cursor: pointer;
    }

    .card:hover {
      background: #333;
    }

    .contentPage {
      text-align: left;
      padding: 15px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
    }

    button {
      padding: 10px;
      margin: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>Wiki Forever</h1>

<div id="path"></div>
<div class="container" id="content"></div>

<script>

const data = {
  "TV Shows": {
    "Marvel": {
      "Agents of Shield": {

        "Characters": {

          "Phil Coulson": {
            content: `Phil Coulson appeared in The Avengers and was killed by Loki using his scepter.

In Agents of S.H.I.E.L.D., it is revealed he did not just briefly die — he was dead for days.

He was brought back to life in the Guest House using the GH.325 formula, which is based on alien blood.

His memories were altered to hide the truth until he later discovers what really happened, including the "Tahiti" project.`
          },

          "Daisy Johnson / Skye": {
            content: `Daisy Johnson, originally known as Skye, was a member of the Rising Tide.

She tried to expose people like Mike Peterson (later known as Deathlok).

She was captured by Ian Quinn (the gravitonium guy), who experimented on her and nearly killed her.

She survived after receiving the GH.325 formula, the same one used on Coulson.

Raina, also known as "the girl with the flower dress," is a separate character who later becomes Inhuman.

In Season 2, Daisy becomes Quake after Terrigenesis triggered by the Obelisk.

Her transformation was intense and not exactly smooth.`
          },

          "Grant Ward": {
            content: `Grant Ward starts as a skilled S.H.I.E.L.D. agent and part of Coulson’s team.

He is later revealed to actually be Hydra, which completely changes his role.

Ward was trained and manipulated by John Garrett.

Even after being exposed, he continues as a major villain with multiple phases, including connections to Hive.

He’s one of the biggest betrayals in the show.`
          },

          "Leo Fitz": {
            content: `Leo Fitz is the engineering and tech specialist of the team.

He works closely with Simmons, and they are basically a duo.

After brain damage from early events, Fitz struggles but still remains one of the smartest members.

Over time, he becomes more serious and hardened.

He is responsible for a lot of the tech that keeps the team going.`
          },

          "Jemma Simmons": {
            content: `Jemma Simmons is the science and medical expert of the team.

She works closely with Fitz, and they have one of the strongest relationships.

Simmons goes through a lot, including being stranded on an alien planet.

She is very smart, determined, and often handles biological or alien-related problems.

She becomes one of the most developed characters over time.`
          },

          "Melinda May": {
            content: `Melinda May is a highly skilled S.H.I.E.L.D. agent and one of the best fighters.

She is known as "The Cavalry" because of a past mission.

May is quiet and serious, but extremely reliable.

She has a close working relationship with Coulson and is one of the most trusted members.

She handles most combat missions and is basically the team’s top fighter.`
          }

        }

      }
    },

    "DC": {
      "Flash": {
        "2014 Edition": {
          content: `So your friend who watched the 2014 Flash series might keep saying "my name is Barry Allen".

Barry Allen is a speedster who saves people and stops villains.

He got his powers after the particle accelerator explosion caused by Eobard Thawne.

Don't watch past Season 4. It gets bad. By Season 7 it's stupid. The ending is... eh.`
        }
      }
    }
  }
};

let current = data;
let stack = [];

function render() {
  const container = document.getElementById("content");
  container.innerHTML = "";

  if (current.content) {
    container.innerHTML = `<div class="contentPage" id="textBox"></div>`;
    document.getElementById("textBox").innerText = current.content;
    updatePath();
    return;
  }

  Object.keys(current).forEach(key => {
    let div = document.createElement("div");
    div.className = "card";
    div.innerText = key;

    div.onclick = () => {
      stack.push(current);
      current = current[key];
      render();
    };

    container.appendChild(div);
  });

  updatePath();
}

function updatePath() {
  const pathDiv = document.getElementById("path");

  if (stack.length > 0) {
    pathDiv.innerHTML = `<button onclick="goBack()">⬅ Back</button>`;
  } else {
    pathDiv.innerHTML = "";
  }
}

function goBack() {
  current = stack.pop();
  render();
}

render();

</script>

</body>
</html>
