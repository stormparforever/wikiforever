<!DOCTYPE html>
<html>
<head>
  <title>Wiki Forever</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      margin: 0;
    }

    h1 {
      margin: 20px 0;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 10px;
    }

    .card {
      background: #222;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
      cursor: pointer;
    }

    .card:hover {
      background: #333;
    }

    .pinned {
      border-left: 5px solid #00bcd4;
      background: #1a1a1a;
    }

    .contentPage {
      text-align: left;
      padding: 15px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
    }

    button {
      padding: 10px;
      margin: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>Wiki Forever</h1>

<div id="path"></div>
<div class="container" id="content"></div>

<script>

const data = {
  "TV Shows": {
    "Marvel": {
      "Agents of Shield": {

        "Main Review": {
          content: `Agents of S.H.I.E.L.D. is a Marvel TV show that starts after Loki invaded Manhattan.

The show follows a new S.H.I.E.L.D. team led by Phil Coulson.

Main members include Ward, Fitz, Simmons, May, and Skye.

The show is really good early on with strong characters and twists like Hydra being inside S.H.I.E.L.D.

Later seasons can be hit or miss, but overall it's worth watching.`
        },

        "Characters": {

          "Phil Coulson": {
            content: `Phil Coulson appeared in The Avengers and was killed by Loki using his scepter.

In Agents of S.H.I.E.L.D., it is revealed he was actually dead for days.

He was revived using the GH.325 formula (alien blood).

His memories were altered until he discovered the truth about Tahiti.`
          },

          "Daisy Johnson / Skye": {
            content: `Daisy Johnson (Skye) was part of the Rising Tide.

She was shot by Ian Quinn (the gravitonium guy) and nearly died.

She survived using the GH.325 formula.

She later becomes Quake after Terrigenesis triggered by the Obelisk.`
          },

          "Grant Ward": {
            content: `Grant Ward starts as a S.H.I.E.L.D. agent but is revealed to be Hydra.

He was trained by John Garrett.

He becomes one of the biggest betrayals in the show and continues as a major villain.`
          },

          "Leo Fitz": {
            content: `Leo Fitz is the engineering and tech specialist.

After brain damage, he struggles but remains one of the smartest members.

He becomes more serious over time.`
          },

          "Jemma Simmons": {
            content: `Jemma Simmons is the science and medical expert.

She goes through major struggles, including being stranded on an alien planet.

She becomes one of the most developed characters.`
          },

          "Melinda May": {
            content: `Melinda May is one of the best fighters on the team.

Known as "The Cavalry", she handles combat missions and is highly trusted.`
          }

        }

      }
    },

    "DC": {
      "Flash": {
        "2014 Edition": {

          "Main Review": {
            content: `So... your friend who watched the 2014 Flash series might keep saying "my name is Barry Allen" in an RP. Who is he?

Barry Allen (The Flash) is a speedster who saves people and stops villains.

He got his powers years after the death of his mom because of Eobard Thawne (disguised as Dr. Wells). It is later revealed Thawne killed his mother after failing to kill Barry.

Anyway, the particle accelerator exploded and created metahumans—and the Flash.

Don't watch past Season 4. It gets bad. By Season 7 it's just stupid. The ending is... eh.`
          },

          "Characters": {

            "Barry Allen": {
              content: `Barry Allen is The Flash.

He gains super speed from the particle accelerator explosion.

His main goal is solving his mother's murder and stopping Eobard Thawne.

He always tries to save everyone, even when it causes problems.`
            },

            "Wally West": {
              content: `Wally West becomes a speedster later in the show.

He is more emotional and impulsive than Barry.

He struggles at first but eventually becomes a hero on his own.`
            },

            "Eobard Thawne": {
              content: `Eobard Thawne (Reverse-Flash) is the main villain.

He pretends to be Harrison Wells while secretly controlling everything.

He killed Barry's mother and caused most of the timeline problems.`
            },

            "Cisco Ramon": {
              content: `Cisco Ramon is the team's tech expert and comic relief.

He names villains and builds tech.

Later, he becomes Vibe.`
            },

            "Caitlin Snow": {
              content: `Caitlin Snow is the team's scientist and doctor.

She goes through a lot, including Ronnie and becoming Killer Frost.

Her story becomes more complex over time.`
            },

            "Firestorm / Ronnie Raymond": {
              content: `Ronnie Raymond was thought dead after the explosion.

He returns as part of Firestorm with Dr. Stein.

His story is emotional and tied to Caitlin.`
            }

          }

        }
      }
    }
  }
};

let current = data;
let stack = [];

function render() {
  const container = document.getElementById("content");
  container.innerHTML = "";

  if (!current || typeof current !== "object") {
    container.innerHTML = "<p>Error loading content.</p>";
    return;
  }

  if (current.content) {
    container.innerHTML = `<div class="contentPage" id="textBox"></div>`;
    document.getElementById("textBox").innerText = current.content;
    updatePath();
    return;
  }

  let keys = Object.keys(current);

  keys.sort((a, b) => {
    if (a === "Main Review" && b !== "Main Review") return -1;
    if (b === "Main Review" && a !== "Main Review") return 1;
    return a.localeCompare(b);
  });

  keys.forEach(key => {
    let div = document.createElement("div");
    div.className = "card";

    if (key === "Main Review") {
      div.classList.add("pinned");
    }

    div.innerText = key;

    div.onclick = () => {
      stack.push(current);
      current = current[key];
      render();
    };

    container.appendChild(div);
  });

  updatePath();
}

function updatePath() {
  const pathDiv = document.getElementById("path");

  if (stack.length > 0) {
    pathDiv.innerHTML = `<button onclick="goBack()">⬅ Back</button>`;
  } else {
    pathDiv.innerHTML = "";
  }
}

function goBack() {
  if (stack.length > 0) {
    current = stack.pop();
    render();
  }
}

render();

</script>

</body>
</html>
