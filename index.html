<!DOCTYPE html>
<html>
<head>
  <title>Wiki Forever</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      margin: 0;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 10px;
    }

    .card {
      background: #222;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
      cursor: pointer;
    }

    .card:hover {
      background: #333;
    }

    .title {
      font-size: 18px;
      font-weight: bold;
    }

    .contentPage {
      text-align: left;
      padding: 10px;
    }

    .scrollBox {
      max-height: 300px;
      overflow-y: auto;
      background: #1a1a1a;
      padding: 10px;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
    }

    .updateBox {
      background: #2a2a2a;
      border-left: 5px solid #4CAF50;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 8px;
    }

    button {
      padding: 10px;
      margin: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>Wiki Forever</h1>

<div id="path"></div>
<div class="container" id="content"></div>

<script>

// 🔔 update text (safe)
const latestUpdate = "This site is still being built. More pages coming soon.";

const data = {
  "TV Shows": {
    "Marvel": {
      "Agents of Shield": {
        content: "This is my page about Agents of Shield.\n\nAgents of S.H.I.E.L.D. is a Marvel show set after Loki invaded Manhattan.\n\nCharacters:\nGrant Ward (Hydra)\nJemma Simmons\nLeo Fitz\nMelinda May\nPhil Coulson\n\nJohn Garrett is revealed as the Clairvoyant."
      }
    },
    "DC": {
      "Flash": {
        "2014 Edition": {
          content: "So your friend who watched the 2014 Flash keeps saying \"my name is Barry Allen\".\n\nBarry Allen is a speedster who saves people.\n\nHe got powers after the particle accelerator explosion caused by Eobard Thawne.\n\nDon't watch past Season 4. It gets bad. By Season 7 it's stupid. The ending is... eh."
        }
      }
    }
  }
};

let current = data;
let stack = [];

function render() {
  const container = document.getElementById("content");
  container.innerHTML = "";

  try {

    if (current.content) {
      container.innerHTML = `
        <div class="contentPage">

          <div class="updateBox">
            <strong>🔔 Author Update</strong>
            <p>${latestUpdate}</p>
          </div>

          <h2>Info</h2>
          <div class="scrollBox" id="textBox"></div>

        </div>
      `;

      // SAFE TEXT RENDER (prevents crashes)
      document.getElementById("textBox").innerText = current.content;

      updatePath();
      return;
    }

    Object.keys(current).forEach(key => {
      let div = document.createElement("div");
      div.className = "card";
      div.innerText = key;

      div.onclick = () => {
        stack.push(current);
        current = current[key];
        render();
      };

      container.appendChild(div);
    });

    updatePath();

  } catch (e) {
    container.innerHTML = "<p>Something broke. Check your text formatting.</p>";
    console.error(e);
  }
}

function updatePath() {
  const pathDiv = document.getElementById("path");

  if (stack.length > 0) {
    pathDiv.innerHTML = `<button onclick="goBack()">⬅ Back</button>`;
  } else {
    pathDiv.innerHTML = "";
  }
}

function goBack() {
  current = stack.pop();
  render();
}

render();

</script>

</body>
</html>
